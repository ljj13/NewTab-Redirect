name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev toolchain
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Static checks (manifest / locales / remote code)
        run: npm run check

      - name: Package extension ZIP
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: newtab-redirect
          path: dist/*.zip
          if-no-files-found: error
